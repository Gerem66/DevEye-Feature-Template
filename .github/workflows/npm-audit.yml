# An advisory against a package your feature ships does not wait for a push:
# the lockfile of a quiet week is the one that ages.
name: npm audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The lockfile alone: nothing is installed. Development tools are left
      # out, they never reach the server your feature runs on.
      - run: npm audit --omit=dev --audit-level=high
