name: CI

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            # @deveye/types is public on npmjs: a plain install, no token, no
            # registry configuration.
            - run: npm install
            - run: npm run ci
